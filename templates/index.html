<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D AI Site</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <section class="hero">
    <div class="card" id="tiltCard">
      <h1>Welcome to the Future</h1>
      <p>A 3D-styled site with a built-in AI assistant.</p>
    </div>
  </section>

  <section class="dashboard">
    <h2 class="dashboard-title">Tools</h2>
    <div class="tools-grid">

      <!-- Forecast -->
      <div class="tool-card">
        <h3>📈 Revenue Forecast</h3>
        <label>Starting value</label>
        <input type="number" id="fcStart" value="1000">
        <label>Growth rate per period (%)</label>
        <input type="number" id="fcRate" value="5">
        <label>Number of periods</label>
        <input type="number" id="fcPeriods" value="12">
        <button id="fcRun">Run Forecast</button>
        <canvas id="fcChart" height="180"></canvas>
        <div id="fcSummary" class="tool-result"></div>
      </div>

      <!-- Region cost estimator -->
      <div class="tool-card">
        <h3>🌍 Cost by Region</h3>
        <label>Base cost (USD)</label>
        <input type="number" id="ceBase" value="100">
        <label>Region</label>
        <select id="ceRegion"></select>
        <button id="ceRun">Estimate</button>
        <div id="ceResult" class="tool-result"></div>
      </div>

      <!-- Currency converter -->
      <div class="tool-card">
        <h3>💱 Currency Converter</h3>
        <label>Amount</label>
        <input type="number" id="ccAmount" value="100">
        <label>From</label>
        <select id="ccFrom">
          <option>USD</option><option>EUR</option><option>GBP</option>
          <option>INR</option><option>JPY</option><option>AUD</option>
          <option>CAD</option><option>CNY</option>
        </select>
        <label>To</label>
        <select id="ccTo">
          <option>INR</option><option>USD</option><option>EUR</option>
          <option>GBP</option><option>JPY</option><option>AUD</option>
          <option>CAD</option><option>CNY</option>
        </select>
        <button id="ccRun">Convert</button>
        <div id="ccResult" class="tool-result"></div>
      </div>

    </div>
  </section>

  <div id="chatToggle" class="chat-toggle">💬</div>

  <div id="chatWindow" class="chat-window hidden">
    <div class="chat-header">AI Assistant</div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Ask me anything...">
      <button id="chatSend">Send</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
